# Perfil optimizado para instancias GCP Free Tier e2-micro (1 GB RAM + 2 GB Swap)
# Ejecutar con: docker compose -f docker-compose.lite.yml up --build -d
services:
  redis:
    image: redis:7-alpine
    container_name: nextgen_redis
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: nextgen_rabbitmq
    restart: unless-stopped

  api:
    build: .
    container_name: nextgen_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      - redis
      - rabbitmq
    ports:
      - "8000:8000"

  worker:
    build: .
    container_name: nextgen_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      - api
      - redis
      - rabbitmq
    command: ["python", "-m", "worker.worker"]

  dashboard:
    build: ./dashboard
    container_name: nextgen_dashboard
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: nextgen_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    ports:
      - "8080:8080"
