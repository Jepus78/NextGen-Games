services:
  redis:
    image: redis:7-alpine
    container_name: nextgen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nextgen_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: .
    container_name: nextgen_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      - redis
      - rabbitmq
    ports:
      - "8000:8000"

  worker:
    build: .
    container_name: nextgen_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      - api
      - redis
      - rabbitmq
    command: ["python", "-m", "worker.worker"]

  dashboard:
    build: ./dashboard
    container_name: nextgen_dashboard
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "8501:8501"

  nginx:
    image: nginx:alpine
    container_name: nextgen_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: nextgen_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: nextgen_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
